<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7170ff"/>
      <stop offset="1" stop-color="#5e6ad2"/>
    </linearGradient>
  </defs>
  <!-- dark rounded base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f1011"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- radar sweep -->
  <path d="M32 32 L32 12 A20 20 0 0 1 50.3 21 Z" fill="url(#g)" opacity="0.4"/>
  <!-- rings -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#7170ff" stroke-width="2" opacity="0.8"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#828fff" stroke-width="1.5" opacity="0.45"/>
  <!-- blips -->
  <circle cx="43" cy="22" r="3" fill="#7170ff"/>
  <circle cx="25" cy="41" r="2.5" fill="#828fff"/>
  <!-- centre -->
  <circle cx="32" cy="32" r="3.5" fill="#7170ff"/>
</svg>