<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>RepoRadar — Find the repo you actually need</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111722;
    --panel2: #16202e;
    --line: #223043;
    --text: #e6edf7;
    --dim: #8fa1b8;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --warn: #fbbf24;
    --star: #fbbf24;
    --radar: rgba(74, 222, 128, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'Cascadia Code', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(34, 211, 238, 0.08), transparent),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(74, 222, 128, 0.06), transparent);
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

  /* ── Header ─────────────────────────────── */
  .logo {
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 700; letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .logo .dot { color: var(--accent); }
  .logo .radar {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--accent);
    position: relative;
    box-shadow: 0 0 12px var(--radar), inset 0 0 8px var(--radar);
    animation: ping 2.4s ease-out infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,.5); }
    70% { box-shadow: 0 0 0 14px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }
  .tagline { color: var(--dim); font-size: 13px; margin-bottom: 28px; }
  .tagline b { color: var(--accent2); font-weight: 600; }

  /* ── Search box ─────────────────────────── */
  .searchbox {
    display: flex; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 8px; align-items: center;
    transition: border-color .2s, box-shadow .2s;
  }
  .searchbox:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74,222,128,.12), 0 0 24px rgba(74,222,128,.05);
  }
  .searchbox input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 16px; padding: 10px 12px;
    font-family: inherit;
  }
  .searchbox input::placeholder { color: #5b6b80; }
  .searchbox button {
    background: linear-gradient(135deg, var(--accent), #22c55e);
    color: #052e16; border: none; border-radius: 9px;
    font-weight: 700; font-size: 15px; padding: 12px 22px;
    cursor: pointer; font-family: inherit; transition: transform .1s, opacity .2s;
  }
  .searchbox button:hover { opacity: .9; transform: translateY(-1px); }
  .searchbox button:disabled { opacity: .5; cursor: wait; }

  .examples { margin: 14px 2px 6px; color: var(--dim); font-size: 12.5px; }
  .examples button {
    background: var(--panel2); color: var(--accent2);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; margin: 3px 6px 3px 0; cursor: pointer;
    font-size: 12px; font-family: inherit; transition: border-color .2s;
  }
  .examples button:hover { border-color: var(--accent2); }

  /* ── Status / understood ────────────────── */
  .status { margin: 18px 2px 0; font-size: 13px; color: var(--dim); }
  .understood {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 12.5px;
  }
  .understood .lbl { color: var(--dim); text-transform: uppercase; font-size: 10.5px; letter-spacing: 1px; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 9px; color: var(--text);
  }
  .chip b { color: var(--accent2); }
  .elapsed { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* ── Results ────────────────────────────── */
  .results { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .resulthead {
    color: var(--dim); font-size: 12.5px; letter-spacing: 0.3px;
    padding: 2px 4px 0;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; transition: border-color .2s, transform .15s;
  }
  .card:hover { border-color: #2e4057; transform: translateY(-1px); }
  .card .row1 { display: flex; align-items: baseline; gap: 10px; }
  .card .rank {
    color: var(--accent); font-weight: 700; font-size: 13px;
    min-width: 24px; text-align: right;
  }
  .card .name { font-size: 16.5px; font-weight: 700; }
  .card .name a { color: var(--text); text-decoration: none; }
  .card .name a:hover { color: var(--accent2); text-decoration: underline; }
  .card .stars { color: var(--star); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .card .lang { color: var(--dim); font-size: 12px; }
  .card .desc { color: var(--dim); font-size: 13.5px; margin-top: 8px; line-height: 1.5; }
  .card .snippet {
    margin-top: 10px; font-size: 12.5px; line-height: 1.6; color: #b8c6d8;
    background: var(--panel2); border-left: 3px solid var(--accent2);
    border-radius: 0 8px 8px 0; padding: 8px 12px;
    word-break: break-word;
  }
  .card .snippet b { color: var(--warn); }
  .card .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .card .topic {
    background: rgba(34, 211, 238, 0.08); border: 1px solid rgba(34, 211, 238, 0.18);
    color: #7ddbe9; border-radius: 999px; padding: 1px 9px; font-size: 11px;
  }
  .scores { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 11.5px; color: var(--dim); }
  .match {
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: #5b6b80;
    text-transform: uppercase; font-size: 10px; letter-spacing: 0.6px;
  }
  .match.on { color: var(--accent2); border-color: rgba(34, 211, 238, 0.3); }
  .fusion-sim { margin-left: auto; }
  .fusion-sim b { color: var(--accent); font-weight: 600; }
  .go {
    display: inline-block; margin-top: 10px;
    color: var(--accent); font-size: 12.5px; font-weight: 600; text-decoration: none;
  }
  .go:hover { text-decoration: underline; }

  .empty { color: var(--dim); text-align: center; padding: 60px 0; font-size: 14px; }
  .err { color: #f87171; text-align: center; padding: 30px 0; font-size: 13.5px; }
  .loading {
    color: var(--dim); font-size: 13px; display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 32px 0;
  }
  .loading .scan-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent), 0 0 22px rgba(74,222,128,.5);
    animation: ping 1.2s ease-in-out infinite;
  }
  @keyframes ping {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: .55; }
  }
  @keyframes blink { 50% { opacity: 0; } }

  .footer { margin-top: 40px; text-align: center; color: #4a5a70; font-size: 12px; }
  .footer .repo-count { color: var(--accent2); }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <span class="radar"></span>
    <span>Repo<span class="dot">Radar</span></span>
  </div>
  <div class="tagline">Google for GitHub repos — describe the problem, find the project. <b>Long-tail included.</b></div>

  <form class="searchbox" id="form">
    <input id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder='e.g. "pdf invoice parser for GST in python"' autofocus>
    <button type="submit" id="btn">Scan</button>
  </form>

  <div class="examples">
    <button data-q="a game where silly banana characters come to life">🍌 banana game</button>
    <button data-q="api key manager for ai agents">🔑 api key manager</button>
    <button data-q="terminal multiplexer to split my terminal into panes">🖥️ terminal multiplexer</button>
    <button data-q="lightweight embedded key value database in go">🗄️ kv database go</button>
    <button data-q="remove background from photos programmatically">🖼️ remove bg</button>
  </div>

  <div id="status"></div>
  <div id="understood"></div>
  <div id="results" class="results"></div>

  <div class="footer">
    RepoRadar · local-first search over <span class="repo-count" id="count">…</span> repos ·
    BM25 + embeddings + Groq understanding
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const form = $('#form'), input = $('#q'), btn = $('#btn');
const statusEl = $('#status'), understoodEl = $('#understood'), resultsEl = $('#results');

async function health() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    $('#count').textContent = d.repos ? d.repos.toLocaleString() : '—';
  } catch (e) { $('#count').textContent = '—'; }
}
health();

document.querySelectorAll('.examples button').forEach(b => {
  b.addEventListener('click', () => { input.value = b.dataset.q; form.requestSubmit(); });
});

// "/" focuses the search box from anywhere (like GitHub/Google)
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== input) {
    e.preventDefault();
    input.focus();
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;

  btn.disabled = true; btn.textContent = '…';
  statusEl.innerHTML = '<div class="loading"><span class="scan-dot"></span> Scanning the radar…</div>';
  understoodEl.innerHTML = ''; resultsEl.innerHTML = '';

  try {
    const resp = await fetch('/api/search?q=' + encodeURIComponent(q) + '&limit=10');
    const d = await resp.json();
    if (d.error) throw new Error(d.error);

    // understood box
    const u = d.understood || {};
    let chips = '';
    if (u.semantic) chips += `<span class="chip">🎯 <b>${escapeHtml(u.semantic)}</b></span>`;
    if (u.filters) {
      if (u.filters.language) chips += `<span class="chip">lang: <b>${escapeHtml(u.filters.language)}</b></span>`;
      if (u.filters.min_stars > 1) chips += `<span class="chip">stars ≥ <b>${u.filters.min_stars}</b></span>`;
      if (u.filters.updated_after) chips += `<span class="chip">updated ≥ <b>${u.filters.updated_after}</b></span>`;
    }
    if (u.source) chips += `<span class="chip">src: <b>${u.source}</b></span>`;
    statusEl.innerHTML = '';
    understoodEl.innerHTML = chips
      ? `<div class="understood"><span class="lbl">Understood</span>${chips}<span class="elapsed">${d.elapsed_ms} ms</span></div>`
      : '';

    // results
    if (!d.results || !d.results.length) {
      resultsEl.innerHTML = '<div class="empty"><div style="font-size:28px;margin-bottom:12px">📡</div>Nothing on the radar for that one.<br><span style="color:#5b6b80;font-size:12.5px">Try different words, or a broader description of what you want to build.</span></div>';
    } else {
      const rl = d.results.length;
      resultsEl.innerHTML = `<div class="resulthead">${rl} result${rl>1?'s':''} · best match on top</div>` +
        d.results.map((r, i) => {
        const kw = r.bm25_score != null ? r.bm25_score : '—';
        const sem = r.sem_score != null ? r.sem_score : '—';
        const snippet = r.snippet ? `<div class="snippet">${renderSnippet(r.snippet)}</div>` : '';
        const desc = r.description ? `<div class="desc">${escapeHtml(r.description)}</div>` : '';
        const lang = r.language ? `<span class="lang">${escapeHtml(r.language)}</span>` : '';
        const topics = (r.topics && r.topics.length)
          ? `<div class="topics">${r.topics.map(t => `<span class="topic">${escapeHtml(t)}</span>`).join('')}</div>` : '';
        return `
        <div class="card">
          <div class="row1">
            <span class="rank">${i+1}</span>
            <span class="name"><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.full_name)}</a></span>
            ${lang}
            <span class="stars">⭐ ${r.stars.toLocaleString()}</span>
          </div>
          ${desc}
          ${topics}
          ${snippet}
          <div class="scores">
            <span class="match ${kw !== '—' ? 'on' : ''}">words</span>
            <span class="match ${sem !== '—' ? 'on' : ''}">meaning</span>
            <span class="fusion-sim">similarity <b>${r.rrf}</b></span>
          </div>
          <a class="go" href="${r.url}" target="_blank" rel="noopener">open on GitHub →</a>
        </div>`;
      }).join('');
    }
  } catch (err) {
    statusEl.innerHTML = '';
    resultsEl.innerHTML = `<div class="err">⚠️ ${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Scan';
  }
});

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Render a snippet: escape everything, then turn **term** markers into real bold.
function renderSnippet(s) {
  const escaped = escapeHtml(s);
  return escaped.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
</script>
</body>
</html>
