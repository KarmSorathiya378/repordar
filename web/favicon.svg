<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- dark rounded base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111722"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#223043" stroke-width="2"/>
  <!-- radar sweep -->
